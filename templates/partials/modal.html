<div class="modal-overlay" onclick="if(event.target===this && Date.now()-(window.modalGeoeffnetUm||0)>400)document.getElementById('modal-container').innerHTML=''">
  <div class="modal-dialog">
    <h2>Artikel bearbeiten</h2>
    <!-- Speichern und Löschen teilen sich die Sync-Warteschlange des Formulars (drop) und
         sperren beide Buttons, solange eine Anfrage läuft. -->
    <form hx-put="/artikel/{{ id }}"
          hx-include="#seiten-kontext"
          hx-sync="this:drop"
          hx-disabled-elt="#modal-speichern, #modal-loeschen"
          hx-target="#main-content"
          hx-swap="outerHTML">
      <div class="form-grid">
        <label>Name *</label>
        <div>
          <input type="text" name="name" value="{{ name }}" class="input-name">
          {% if !fehler_name.is_empty() %}<span class="field-error">{{ fehler_name }}</span>{% endif %}
        </div>
        <label>Ablaufdatum *</label>
        <div>
          <input type="date" name="ablaufdatum" value="{{ ablaufdatum }}" max="9999-12-31" placeholder="TT.MM.JJJJ" class="input-datum">
          {% if !fehler_ablaufdatum.is_empty() %}<span class="field-error">{{ fehler_ablaufdatum }}</span>{% endif %}
        </div>
        <label>Menge</label>
        <div>
          <input type="number" min="1" step="1" inputmode="numeric" name="menge" value="{{ menge }}" placeholder="z. B. 2" class="input-menge">
          {% if !fehler_menge.is_empty() %}<span class="field-error">{{ fehler_menge }}</span>{% endif %}
        </div>
        <label>Bemerkung</label>
        <div><input type="text" name="bemerkung" value="{{ bemerkung }}" class="input-bemerkung"></div>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-save" id="modal-speichern">Speichern</button>
        <button type="button" class="btn-delete" id="modal-loeschen"
                hx-delete="/artikel/{{ id }}"
                hx-include="#seiten-kontext"
                hx-sync="closest form:drop"
                hx-disabled-elt="#modal-speichern, #modal-loeschen"
                hx-confirm="Artikel &#39;{{ name }}&#39; wirklich löschen?"
                hx-target="#main-content"
                hx-swap="outerHTML">Löschen</button>
        <button type="button" class="btn-cancel"
                onclick="document.getElementById('modal-container').innerHTML=''">Abbrechen</button>
      </div>
    </form>
  </div>
</div>
